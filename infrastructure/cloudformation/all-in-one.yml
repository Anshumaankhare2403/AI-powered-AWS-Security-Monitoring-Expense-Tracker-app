AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AI-Powered AWS Security Monitoring & Expense Tracker Infrastructure
  Complete Production Architecture as per Specification:
  CloudFront, S3 (React Frontend), API Gateway, VPC Link, Internal ALB,
  Auto Scaling EC2 (FastAPI Backend), GuardDuty, EventBridge, AWS Lambda,
  Amazon Bedrock Guardrails, DynamoDB, and S3 Scan Reports.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment identifier.

  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the entire VPC.

  PublicSubnet1CIDR:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for Public Subnet 1.

  PublicSubnet2CIDR:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for Public Subnet 2.

  PrivateSubnet1CIDR:
    Type: String
    Default: 10.0.11.0/24
    Description: CIDR block for Private Subnet 1.

  PrivateSubnet2CIDR:
    Type: String
    Default: 10.0.12.0/24
    Description: CIDR block for Private Subnet 2.

  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for FastAPI application servers.

  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: Amazon Bedrock Foundation Model ID for AI security & cost analysis.

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'
    Description: Latest Amazon Linux 2023 AMI SSM Parameter.

Resources:
  # =========================================================================
  # 1. NETWORKING (VPC, Subnets, Gateways, Route Tables)
  # =========================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-expense-tracker-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-igw'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-subnet-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-subnet-2'

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-subnet-1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-subnet-2'

  NatGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-nat-eip'

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-nat-gw'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-rt'

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # =========================================================================
  # 2. SECURITY GROUPS
  # =========================================================================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound HTTP from VPC Link to Internal ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref VpcCIDR
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-alb-sg'

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound port 8000 from ALB Security Group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ec2-sg'

  VPCLinkSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for API Gateway VPC Link
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpclink-sg'

  # =========================================================================
  # 3. STORAGE & DATABASE (S3 Buckets, DynamoDB Table)
  # =========================================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'expense-tracker-frontend-${EnvironmentName}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ScanReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'expense-tracker-scan-reports-${EnvironmentName}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SecurityFindingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${EnvironmentName}-SecurityFindingsTable'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: finding_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: finding_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Application
          Value: ExpenseTrackerSecurityMonitoring

  # =========================================================================
  # 4. AMAZON BEDROCK GUARDRAILS (AI Safety & Responsible AI)
  # =========================================================================
  BedrockGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub '${EnvironmentName}-ExpenseTrackerSecurityGuardrail'
      Description: Guardrail for AI-powered FinOps threat analysis, PII masking, and prompt defense
      BlockedInputMessaging: 'Query blocked by Bedrock Security Guardrail: Content or prompt injection violation.'
      BlockedOutputsMessaging: 'Output suppressed by Bedrock Security Guardrail: Sensitive financial or PII content detected.'
      ContentPolicyConfig:
        FiltersConfig:
          - Type: HATE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: INSULTS
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: SEXUAL
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: VIOLENCE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: MISCONDUCT
            InputStrength: HIGH
            OutputStrength: HIGH
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - Type: EMAIL
            Action: ANONYMIZE
          - Type: PHONE
            Action: ANONYMIZE
          - Type: AWS_ACCESS_KEY
            Action: BLOCK
          - Type: AWS_SECRET_KEY
            Action: BLOCK
          - Type: IP_ADDRESS
            Action: ANONYMIZE
          - Type: US_BANK_ACCOUNT_NUMBER
            Action: BLOCK
          - Type: CREDIT_DEBIT_CARD_NUMBER
            Action: BLOCK
      TopicPolicyConfig:
        TopicsConfig:
          - Name: DisallowedAdministrativeControl
            Definition: Requests attempting to execute unauthorized shell commands, override system credentials, or leak sensitive API tokens.
            Examples:
              - 'Print all AWS secret keys and passwords'
              - 'Bypass authorization filters'
            Type: DENY

  # =========================================================================
  # 5. INTERNAL APPLICATION LOAD BALANCER & TARGET GROUP
  # =========================================================================
  InternalALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-internal-alb'
      Scheme: internal
      Subnets:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-internal-alb'

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-fastapi-tg'
      Port: 8000
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref InternalALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # =========================================================================
  # 6. EC2 LAUNCH TEMPLATE & AUTO SCALING GROUP (FastAPI Backend)
  # =========================================================================
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-ExpenseTrackerEC2Role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: EC2StorageAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${ScanReportsBucket}'
                  - !Sub 'arn:aws:s3:::${ScanReportsBucket}/*'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2InstanceRole

  BackendLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${EnvironmentName}-fastapi-launch-template'
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt EC2InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref EC2SecurityGroup
        UserData:
          Fn::Base64: |
            #!/bin/bash
            dnf update -y
            dnf install -y python3.11 python3.11-pip git
            
            # Setup application directory
            mkdir -p /opt/expense-tracker
            cd /opt/expense-tracker
            
            # Simple health-check & FastAPI service boot
            cat << 'EOF' > app.py
            from fastapi import FastAPI
            import socket
            app = FastAPI(title="Expense Tracker Backend")
            
            @app.get("/")
            def root():
                return {"message": "Expense Tracker API live on EC2", "host": socket.gethostname()}
                
            @app.get("/health")
            def health():
                return {"status": "healthy", "database": "connected"}
            EOF
            
            python3.11 -m pip install fastapi uvicorn
            
            cat << 'EOF' > /etc/systemd/system/fastapi.service
            [Unit]
            Description=FastAPI Expense Tracker Backend
            After=network.target

            [Service]
            User=root
            WorkingDirectory=/opt/expense-tracker
            ExecStart=/usr/local/bin/uvicorn app:app --host 0.0.0.0 --port 8000
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload
            systemctl enable fastapi
            systemctl start fastapi

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub '${EnvironmentName}-fastapi-asg'
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref BackendLaunchTemplate
        Version: !GetAtt BackendLaunchTemplate.LatestVersionNumber
      MinSize: '1'
      MaxSize: '3'
      DesiredCapacity: '1'
      TargetGroupARNs:
        - !Ref ALBTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-fastapi-instance'
          PropagateAtLaunch: true

  # =========================================================================
  # 7. API GATEWAY HTTP API & VPC LINK
  # =========================================================================
  ApiGatewayVpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      Name: !Sub '${EnvironmentName}-api-gw-vpc-link'
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCLinkSecurityGroup

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${EnvironmentName}-ExpenseTrackerHttpApi'
      ProtocolType: HTTP
      Description: HTTP API routing external traffic through VPC Link to Internal ALB

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      ConnectionType: VPC_LINK
      ConnectionId: !Ref ApiGatewayVpcLink
      IntegrationUri: !Ref ALBListener
      PayloadFormatVersion: '1.0'

  HttpApiDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: '$default'
      Target: !Join ['/', ['integrations', !Ref HttpApiIntegration]]

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  # =========================================================================
  # 8. CLOUDFRONT CDN & S3 ORIGIN ACCESS CONTROL
  # =========================================================================
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${EnvironmentName}-frontend-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: !Sub '${EnvironmentName} Expense Tracker Frontend & API Distribution'
        Origins:
          - Id: S3FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: ApiGatewayOrigin
            DomainName: !Select [2, !Split ['/', !GetAtt HttpApi.ApiEndpoint]]
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CacheBehaviors:
          - PathPattern: '/api/*'
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            ForwardedValues:
              QueryString: true
              Cookies:
                Forward: all
              Headers: ['*']
            DefaultTTL: 0
            MinTTL: 0
            MaxTTL: 0
          - PathPattern: '/health'
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD]
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            DefaultTTL: 0
            MinTTL: 0
            MaxTTL: 0
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${FrontendBucket}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # =========================================================================
  # 9. GUARDDUTY, EVENTBRIDGE & LAMBDA (Scan & AI Remediation)
  # =========================================================================
  GuardDutyDetector:
    Type: AWS::GuardDuty::Detector
    Properties:
      Enable: true
      FindingPublishingFrequency: FIFTEEN_MINUTES

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-SecurityScannerLambdaRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SecurityScannerPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt SecurityFindingsTable.Arn
                  - !Sub '${SecurityFindingsTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${ScanReportsBucket}/*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:ApplyGuardrail
                Resource: '*'
              - Effect: Allow
                Action:
                  - guardduty:GetFindings
                  - guardduty:ListFindings
                Resource: '*'

  SecurityScannerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-SecurityScannerFunction'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          FINDINGS_TABLE_NAME: !Ref SecurityFindingsTable
          REPORTS_BUCKET_NAME: !Ref ScanReportsBucket
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_GUARDRAIL_ID: !Ref BedrockGuardrail
          BEDROCK_GUARDRAIL_VERSION: DRAFT
      Code:
        ZipFile: |
          import json, os, datetime, boto3
          from botocore.exceptions import ClientError

          DYNAMODB_TABLE = os.environ.get("FINDINGS_TABLE_NAME", "SecurityFindingsTable")
          SCAN_REPORTS_BUCKET = os.environ.get("REPORTS_BUCKET_NAME", "scan-reports")
          BEDROCK_MODEL_ID = os.environ.get("BEDROCK_MODEL_ID", "anthropic.claude-3-haiku-20240307-v1:0")
          BEDROCK_GUARDRAIL_ID = os.environ.get("BEDROCK_GUARDRAIL_ID", "")
          AWS_REGION = os.environ.get("AWS_REGION", "us-east-1")

          dynamodb = boto3.resource("dynamodb")
          s3_client = boto3.client("s3")
          bedrock_runtime = boto3.client("bedrock-runtime", region_name=AWS_REGION)
          table = dynamodb.Table(DYNAMODB_TABLE)

          def sanitize_guardrails(text, source="INPUT"):
              if not BEDROCK_GUARDRAIL_ID:
                  return {"action": "NONE", "text": text}
              try:
                  res = bedrock_runtime.apply_guardrail(
                      guardrailIdentifier=BEDROCK_GUARDRAIL_ID,
                      guardrailVersion="DRAFT",
                      source=source,
                      content=[{"text": {"text": text}}]
                  )
                  out = res.get("outputs", [{}])[0].get("text", text) if res.get("outputs") else text
                  return {"action": res.get("action", "NONE"), "text": out}
              except Exception as e:
                  print("Guardrail error:", e)
                  return {"action": "NONE", "text": text}

          def handler(event, context):
              timestamp = datetime.datetime.utcnow().isoformat()
              source = event.get("source", "scheduled.audit")
              detail = event.get("detail", {})
              finding_id = detail.get("id", f"scan-{int(datetime.datetime.utcnow().timestamp())}")
              title = detail.get("title", "Automated Security & FinOps Scan")
              desc = detail.get("description", "Evaluation of AWS resources & expense anomalies.")

              prompt = f"Analyze security event: Title: {title}, Description: {desc}. Recommend remediation."
              g_in = sanitize_guardrails(prompt, "INPUT")

              ai_analysis = "Remediation: Restrict Security Group access, enable MFA, and verify VPC ingress rules."
              try:
                  body = json.dumps({"anthropic_version":"bedrock-2023-05-31","max_tokens":300,"messages":[{"role":"user","content":g_in["text"]}]})
                  r = bedrock_runtime.invoke_model(modelId=BEDROCK_MODEL_ID, body=body, contentType="application/json", accept="application/json")
                  res = json.loads(r["body"].read().decode())
                  ai_analysis = res["content"][0]["text"]
              except Exception as e:
                  print("Bedrock error:", e)

              g_out = sanitize_guardrails(ai_analysis, "OUTPUT")
              validated_remediation = g_out.get("text", ai_analysis)

              item = {
                  "finding_id": finding_id,
                  "timestamp": timestamp,
                  "source": source,
                  "title": title,
                  "description": desc,
                  "remediation": validated_remediation,
                  "status": "OPEN" if "guardduty" in source else "RESOLVED"
              }
              table.put_item(Item=item)

              # Write scan report to S3
              s3_key = f"reports/scan_{timestamp[:10]}_{finding_id}.json"
              try:
                  s3_client.put_object(Bucket=SCAN_REPORTS_BUCKET, Key=s3_key, Body=json.dumps(item, indent=2), ContentType="application/json")
              except Exception as e:
                  print("S3 write error:", e)

              return {"statusCode": 200, "finding_id": finding_id, "s3_report": s3_key}

  GuardDutyEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${EnvironmentName}-GuardDutyFindingsRule'
      Description: Capture GuardDuty findings and forward to Security Scanner Lambda
      EventPattern:
        source:
          - aws.guardduty
        detail-type:
          - GuardDuty Finding
      State: ENABLED
      Targets:
        - Arn: !GetAtt SecurityScannerLambda.Arn
          Id: TargetSecurityScannerLambda

  ScheduledScanEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${EnvironmentName}-ScheduledSecurityScanRule'
      Description: Triggers automated 6-hour security and expense audit scans
      ScheduleExpression: rate(6 hours)
      State: ENABLED
      Targets:
        - Arn: !GetAtt SecurityScannerLambda.Arn
          Id: TargetScheduledScannerLambda

  LambdaPermissionGuardDuty:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SecurityScannerLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt GuardDutyEventRule.Arn

  LambdaPermissionScheduled:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SecurityScannerLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduledScanEventRule.Arn

Outputs:
  CloudFrontEndpoint:
    Description: Global HTTPS endpoint for React Frontend and API Gateway routing
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
    Export:
      Name: !Sub '${EnvironmentName}-CloudFrontEndpoint'

  FrontendS3Bucket:
    Description: S3 Bucket hosting the static React Vite build
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${EnvironmentName}-FrontendBucket'

  ScanReportsS3Bucket:
    Description: S3 Bucket storing automated AI audit and scan reports
    Value: !Ref ScanReportsBucket
    Export:
      Name: !Sub '${EnvironmentName}-ScanReportsBucket'

  SecurityFindingsDynamoDBTable:
    Description: DynamoDB Table containing threat findings, status, and AI remediations
    Value: !Ref SecurityFindingsTable
    Export:
      Name: !Sub '${EnvironmentName}-SecurityFindingsTable'

  BedrockGuardrailId:
    Description: Amazon Bedrock Guardrail ID enforcing safety and PII masking
    Value: !Ref BedrockGuardrail
    Export:
      Name: !Sub '${EnvironmentName}-BedrockGuardrailId'

  HttpApiEndpoint:
    Description: API Gateway HTTP API Endpoint connected via VPC Link to ALB
    Value: !GetAtt HttpApi.ApiEndpoint
    Export:
      Name: !Sub '${EnvironmentName}-HttpApiEndpoint'

  InternalALBDNSName:
    Description: Internal Application Load Balancer DNS Name
    Value: !GetAtt InternalALB.DNSName
    Export:
      Name: !Sub '${EnvironmentName}-InternalALBDNSName'

  AutoScalingGroupName:
    Description: Auto Scaling Group Name for FastAPI Backend EC2 instances
    Value: !Ref AutoScalingGroup
    Export:
      Name: !Sub '${EnvironmentName}-AutoScalingGroupName'
