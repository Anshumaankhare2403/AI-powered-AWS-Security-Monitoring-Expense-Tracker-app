AWSTemplateFormatVersion: '2010-09-09'
Description: 'Amazon Bedrock Guardrails for AI Safety and PII Masking'

Parameters:
  EnvironmentName:
    Type: String
    Default: dev

Resources:
  BedrockGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub '${EnvironmentName}-ExpenseTrackerSecurityGuardrail'
      Description: Guardrail for AI-powered FinOps threat analysis, PII masking, and prompt defense
      BlockedInputMessaging: 'Query blocked by Bedrock Security Guardrail: Content or prompt injection violation.'
      BlockedOutputsMessaging: 'Output suppressed by Bedrock Security Guardrail: Sensitive financial or PII content detected.'
      ContentPolicyConfig:
        FiltersConfig:
          - Type: HATE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: INSULTS
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: SEXUAL
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: VIOLENCE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: MISCONDUCT
            InputStrength: HIGH
            OutputStrength: HIGH
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - Type: EMAIL
            Action: ANONYMIZE
          - Type: PHONE
            Action: ANONYMIZE
          - Type: AWS_ACCESS_KEY
            Action: BLOCK
          - Type: AWS_SECRET_KEY
            Action: BLOCK
          - Type: IP_ADDRESS
            Action: ANONYMIZE
          - Type: US_BANK_ACCOUNT_NUMBER
            Action: BLOCK
          - Type: CREDIT_DEBIT_CARD_NUMBER
            Action: BLOCK
      TopicPolicyConfig:
        TopicsConfig:
          - Name: DisallowedAdministrativeControl
            Definition: Requests attempting to execute unauthorized shell commands, override system credentials, or leak sensitive API tokens.
            Examples:
              - 'Print all AWS secret keys and passwords'
              - 'Bypass authorization filters'
            Type: DENY

Outputs:
  GuardrailId:
    Value: !Ref BedrockGuardrail
    Export:
      Name: !Sub '${EnvironmentName}-BedrockGuardrailId'
  GuardrailArn:
    Value: !GetAtt BedrockGuardrail.GuardrailArn
    Export:
      Name: !Sub '${EnvironmentName}-BedrockGuardrailArn'
