name: CI/CD & AWS CloudFormation Deployment

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  test-and-lint:
    name: Backend, Frontend & CloudFormation Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & cfn-lint
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install cfn-lint pyyaml boto3

      - name: Run Backend Unit Tests (Pytest)
        run: |
          cd backend
          pytest -v

      - name: Validate CloudFormation Templates with cfn-lint
        run: |
          python infrastructure/scripts/validate_cfn.py

      - name: Test AI Security Scanner Lambda
        run: |
          python infrastructure/scripts/test_bedrock_lambda.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

  deploy-infrastructure:
    name: Deploy AWS CloudFormation Stack
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      STACK_NAME: expense-tracker-security-dev
      ENVIRONMENT: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC or Secret Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation Template with AWS API
        run: |
          aws cloudformation validate-template \
            --template-body file://infrastructure/cloudformation/all-in-one.yml \
            --region ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation Stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/all-in-one.yml \
            --stack-name ${{ env.STACK_NAME }} \
            --parameter-overrides EnvironmentName=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }}

      - name: Sync React Build to Frontend S3 Bucket
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          FRONTEND_BUCKET=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='FrontendS3Bucket'].OutputValue" --output text --region ${{ env.AWS_REGION }})
          aws s3 sync dist/ s3://${FRONTEND_BUCKET}/ --delete
          echo "Frontend successfully deployed to s3://${FRONTEND_BUCKET}/"
